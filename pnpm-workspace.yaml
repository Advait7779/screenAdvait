packages:
  - 'apps/*'
  - '!apps/customer-web'
  - 'services/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true

overrides:
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'brace-expansion@<=5.0.7': 5.0.8
