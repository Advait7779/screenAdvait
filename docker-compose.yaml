services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: screenadvait
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screenadvait_secure_db_pass_2026_x89q}
      POSTGRES_DB: screenadvait
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenadvait -d screenadvait"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: 5000
      TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://screenadvait:${POSTGRES_PASSWORD:-screenadvait_secure_db_pass_2026_x89q}@postgres:5432/screenadvait?schema=public}
      JWT_SECRET: ${JWT_SECRET:-7f8e9d0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://screen.advaitdigital.co.in}
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /data/screenshots
      SCREENSHOT_RETENTION_DAYS: ${SCREENSHOT_RETENTION_DAYS:-7}
    volumes:
      - screenshot_data:/data/screenshots
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  portal:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    depends_on:
      - api
    networks:
      - backend

volumes:
  postgres_data:
  screenshot_data:

networks:
  backend:
    driver: bridge
